:root[data-theme=&quot;light&quot;] {

* {

html &gt; body {

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

  text-underline-offset: 2px;
}

  text-decoration-style: dashed;

h2,
h3,
h4,
h5,
h6,

}

h3,
h4,
h5,

}

b,
strong,
th {

  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {

}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

}

.table thead th {

}

.table tbody tr:last-child :is(th, td) {

}

}

.table.table-sm :is(th, td):not(:last-child) {

}

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {

}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;

}

.card {

  padding: 12px;

  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);

.widget {

  border: 0;
  border-radius: var(--radius-lg);

  color: var(--foreground);
  background: var(--background);

#widget &gt; :not(.card, .widget, .progress) {

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;

    20rem,

    calc(100vw - 10px)

    var(--tooltip-available-height, calc(100vh - 10px)),

.tabular-nums {

  gap: 2px 12px;
  margin-bottom: 0;

.btn,

.form-check-input,
.form-control,

.form-select {

.btn,

#fabric-scanner-design-lab{width:100%;min-width:0}

#fabric-scanner-design-lab .scanner-product{--p-bg:light-dark(#f6f4ee,#182127);--p-surface:light-dark(#fffefa,#212d34);--p-soft:light-dark(#e9eee7,#2b373a);--p-ink:light-dark(#253d49,#e3eeed);--p-muted:light-dark(#5d716b,#b3c7c0);--p-line:light-dark(#d5dfd5,#435852);--p-primary:light-dark(#244e61,#afd6df);--p-primary-ink:light-dark(#ffffff,#14303b);--p-ok:light-dark(#315f43,#b4dbbe);--p-ok-bg:light-dark(#e6f1e6,#234334);--p-warn:light-dark(#7c5421,#f2d09f);--p-warn-bg:light-dark(#f8ecd8,#433827);--p-error:light-dark(#9b3d35,#ffb8ab);--p-error-bg:light-dark(#f7e5df,#4c302d);color:var(--p-ink);background:var(--p-bg);border:1px solid var(--p-line);border-radius:15px;overflow:visible;font:400 15px/1.5 system-ui,-apple-system,sans-serif;min-width:0;max-width:100%;box-shadow:0 9px 26px light-dark(#233e4410,#00000020)}
#fabric-scanner-design-lab .scanner-product *{box-sizing:border-box}

#fabric-scanner-design-lab .scanner-product h2{font-size:24px;line-height:1.25;font-weight:500;letter-spacing:-.035em;overflow-wrap:anywhere}
#fabric-scanner-design-lab .scanner-product h3{font-size:18px;font-weight:500;line-height:1.4}
#fabric-scanner-design-lab .scanner-product small{font-size:12px;line-height:1.4;display:block;font-weight:400}
#fabric-scanner-design-lab .scanner-product b,#fabric-scanner-design-lab .scanner-product strong{font-weight:500}
#fabric-scanner-design-lab .scanner-product button,#fabric-scanner-design-lab .scanner-product input,#fabric-scanner-design-lab .scanner-product select{font:inherit;max-width:100%;min-width:0}
#fabric-scanner-design-lab .scanner-product button{min-height:44px;min-width:44px;border:1px solid var(--p-line);border-radius:8px;padding:10px 16px;background:var(--p-surface);color:var(--p-ink);white-space:normal;overflow-wrap:anywhere}
#fabric-scanner-design-lab .scanner-product button:disabled{opacity:.5;cursor:not-allowed}
#fabric-scanner-design-lab .scanner-product button.primary,#fabric-scanner-design-lab .scanner-product button[aria-pressed=&quot;true&quot;]{background:var(--p-primary);color:var(--p-primary-ink);border-color:var(--p-primary)}
#fabric-scanner-design-lab .scanner-product button.full{width:100%}
#fabric-scanner-design-lab .scanner-product label{display:block;font-size:13px;color:var(--p-muted)}

#fabric-scanner-design-lab .product-header&gt;div{min-width:0;flex:1}

#fabric-scanner-design-lab .connection{font-size:12px;color:var(--p-muted);display:flex;align-items:center;gap:6px;max-width:170px}

#fabric-scanner-design-lab .movement-result{padding:15px 18px;border-radius:9px;background:var(--p-soft);color:var(--p-ink);overflow-wrap:anywhere}

#fabric-scanner-design-lab .movement-result.warning{background:var(--p-warn-bg);color:var(--p-warn)}
#fabric-scanner-design-lab .movement-result.error{background:var(--p-error-bg);color:var(--p-error)}
#fabric-scanner-design-lab .intent-status{background:var(--p-soft);padding:15px 18px;border-radius:8px;font-size:16px}
#fabric-scanner-design-lab .guard-panel{background:var(--p-surface);border:1px solid var(--p-line);padding:19px;border-radius:10px;display:grid;gap:13px}
#fabric-scanner-design-lab .guard-panel.early{border-color:var(--p-warn);color:var(--p-warn)}
#fabric-scanner-design-lab .guard-panel p{font-size:13px;color:var(--p-muted)}

&lt;/style&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;fabric-scanner-design-lab&#x27;);
  if (!root) return;
  const designs = Array.from(root.querySelectorAll(&#x27;.scanner-product&#x27;));
  const options = { scenario: &#x27;Routine&#x27; };
  const states = new Map();
  const groupA = Array.from({length:20}, (_,i) =&gt; ({id:`cotton-${i+1}`,number:i+1,group:&#x27;cotton&#x27;,code:`UL1:P:00000000-0000-4000-8000-${String(i+1).padStart(12,&#x27;0&#x27;)}`}));
  const groupB = Array.from({length:12}, (_,i) =&gt; ({id:`nylon-${i+1}`,number:i+1,group:&#x27;nylon&#x27;,code:`UL1:P:11111111-1111-4111-8111-${String(i+1).padStart(12,&#x27;0&#x27;)}`}));
  const all = [...groupA,...groupB];
  const sampleCode = groupA[2].code;
  let serial = 0;
  const escape = value =&gt; String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, character =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[character]));
  function initial(id) {
    const s = {id,direction:[&#x27;reset&#x27;,&#x27;physical&#x27;,&#x27;cards&#x27;,&#x27;pairing&#x27;,&#x27;scan-act&#x27;,&#x27;suggested&#x27;,&#x27;guided&#x27;,&#x27;console&#x27;].includes(id)?null:&#x27;IN&#x27;,scope:[&#x27;numbered&#x27;,&#x27;basket&#x27;,&#x27;inventory&#x27;].includes(id)?&#x27;selection&#x27;:&#x27;stack&#x27;,scanned:false,selected:[],tray:[],specimen:groupA[2].id,next:2,step:1,destination:null,operator:null,gate:null,pending:null,result:null,busy:false,revision:0,staleConsumed:false,entries:{},serverEntries:{},log:[]};
    all.forEach(item =&gt; { s.entries[item.id] = {state:options.scenario===&#x27;Early exit&#x27;?&#x27;IN&#x27;:options.scenario===&#x27;Mixed stack&#x27;&amp;&amp;item.number&lt;=10?&#x27;IN&#x27;:&#x27;OUT&#x27;,hours:options.scenario===&#x27;Early exit&#x27;?6.5:26}; });
    s.serverEntries = structuredClone(s.entries);
    return s;
  }
  const say = (s,kind,title,text=&#x27;&#x27;) =&gt; {s.result={kind,title,text};};
  const specimens = s =&gt; all.filter(item =&gt; s.selected.includes(item.id));
  function selectedFor(s) {
    if (s.id===&#x27;staging&#x27;&amp;&amp;s.scope!==&#x27;selection&#x27;) return all.filter(item=&gt;s.tray.includes(item.group)).map(item=&gt;item.id);
    if ([&#x27;numbered&#x27;,&#x27;basket&#x27;,&#x27;inventory&#x27;].includes(s.id) || s.scope===&#x27;selection&#x27;) return [...s.selected];
    return s.scope===&#x27;specimen&#x27;?[s.specimen]:groupA.map(item=&gt;item.id);
  }
  function reset(product) { states.set(product.dataset.design,initial(product.dataset.design)); render(product); }
  function available(s) {
    if (options.scenario===&#x27;Unavailable&#x27;) {say(s,&#x27;error&#x27;,&#x27;NOT AVAILABLE&#x27;,&#x27;The simulated server is unreachable. No movement can be submitted.&#x27;);return false;}
    if (s.pending || s.busy) {say(s,&#x27;warning&#x27;,&#x27;Confirmation still pending&#x27;,&#x27;Reconcile the same request before starting another movement.&#x27;);return false;}
    return true;
  }
  function readLabel(s,code=sampleCode) {
    if (!available(s)) return false;
    const item = all.find(item=&gt;item.code===code.trim()) || all.find(item=&gt;item.id===code.trim());
    if (options.scenario===&#x27;Unknown label&#x27; || !item) {say(s,&#x27;error&#x27;,&#x27;Label not registered&#x27;,&#x27;No specimens moved. Verify the label or return to specimen preparation.&#x27;);return false;}
    s.specimen=item.id;s.scanned=true;s.result=null;
    return true;
  }
  function scan(s,code=sampleCode) {
    if(s.id===&#x27;badge&#x27;&amp;&amp;!s.operator){say(s,&#x27;warning&#x27;,&#x27;Operator badge required&#x27;,&#x27;Identify the operator before recording a specimen movement.&#x27;);return;}
    if(s.id===&#x27;basket&#x27;) {
      if(!readLabel(s,code)) return;
      if(s.selected.includes(s.specimen))say(s,&#x27;neutral&#x27;,&#x27;Already in the basket&#x27;,&#x27;The repeated label did not add another specimen.&#x27;);
      else {s.selected.push(s.specimen);say(s,&#x27;neutral&#x27;,&#x27;Specimen added to basket&#x27;,&#x27;Review the scanned specimens and confirm their movement.&#x27;);}
      return;
    }
    if(!readLabel(s,code))return;
    if(s.id===&#x27;guided&#x27;){s.step=3;return;}
    if(s.id===&#x27;inventory&#x27;){s.selected=groupA.map(item=&gt;item.id);say(s,&#x27;neutral&#x27;,&#x27;Stack selected&#x27;,&#x27;Choose a direction. Mixed locations require an exact selection.&#x27;);return;}
    if(s.id===&#x27;numbered&#x27;){if(!s.selected.includes(s.specimen))s.selected.push(s.specimen);return;}
    if([&#x27;scan-act&#x27;,&#x27;suggested&#x27;,&#x27;pairing&#x27;,&#x27;handheld&#x27;].includes(s.id))return;
    commit(s);
  }
  function commit(s,acknowledged=false) {
    if(!available(s))return;
    if(options.scenario===&#x27;Unknown label&#x27;){say(s,&#x27;error&#x27;,&#x27;Label not registered&#x27;,&#x27;No movement can be recorded for this unknown simulated identity.&#x27;);return;}
    const direction=s.id===&#x27;pairing&#x27;?s.destination:s.direction;
    if(!direction){say(s,&#x27;warning&#x27;,s.id===&#x27;pairing&#x27;?&#x27;Scan a destination token&#x27;:&#x27;Choose a movement direction&#x27;,&#x27;No specimens have moved.&#x27;);return;}
    if(!s.scanned&amp;&amp;![&#x27;numbered&#x27;,&#x27;staging&#x27;,&#x27;inventory&#x27;].includes(s.id)){say(s,&#x27;warning&#x27;,&#x27;Read a specimen label first&#x27;,&#x27;The movement needs a registered specimen identity.&#x27;);return;}
    if(s.id===&#x27;badge&#x27;&amp;&amp;!s.operator){say(s,&#x27;warning&#x27;,&#x27;Operator badge required&#x27;);return;}
    let ids=selectedFor(s);
    if(!ids.length){say(s,&#x27;warning&#x27;,&#x27;Choose the specimens&#x27;,&#x27;Select at least one exact specimen or stage a stack.&#x27;);return;}
    const locations=new Set(ids.map(id=&gt;s.entries[id].state));
    if(s.scope===&#x27;stack&#x27;&amp;&amp;locations.size&gt;1){s.scope=&#x27;selection&#x27;;s.selected=[];s.gate={kind:&#x27;selection&#x27;,direction};say(s,&#x27;warning&#x27;,&#x27;This stack has mixed locations&#x27;,&#x27;Select the exact numbered specimens. No eligible subset is moved automatically.&#x27;);return;}
    if(locations.size&gt;1){say(s,&#x27;error&#x27;,&#x27;Selected specimens have different locations&#x27;,&#x27;Choose specimens all entering or all leaving. This request made no partial changes.&#x27;);return;}
    if(options.scenario===&#x27;Stale selection&#x27;&amp;&amp;!s.staleConsumed){s.staleConsumed=true;s.revision++;s.selected=[];s.gate=null;say(s,&#x27;error&#x27;,&#x27;Selection changed while you reviewed it&#x27;,&#x27;The simulated server rejected every change. Review the current specimens and submit a new request.&#x27;);return;}
    if(ids.every(id=&gt;s.entries[id].state===direction)){
      s.gate=null;
      if([&#x27;reset&#x27;,&#x27;physical&#x27;].includes(s.id))s.direction=null;
      if(s.id===&#x27;guided&#x27;)s.step=4;
      if([&#x27;basket&#x27;,&#x27;inventory&#x27;].includes(s.id))s.selected=[];
      if(s.id===&#x27;staging&#x27;)s.tray=[];
      if(s.id===&#x27;pairing&#x27;){s.destination=null;s.scanned=false;}
      if([&#x27;handheld&#x27;,&#x27;suggested&#x27;].includes(s.id))s.scanned=false;
      say(s,&#x27;neutral&#x27;,&#x27;Already recorded · no changes&#x27;,`All ${ids.length} selected specimens are already ${direction}. Original entry times and session counts are preserved.`);return;
    }
    const early=direction===&#x27;OUT&#x27;?ids.filter(id=&gt;s.entries[id].hours&lt;24):[];
    if(early.length&amp;&amp;!acknowledged){s.gate={kind:&#x27;early&#x27;,direction,ids,early};say(s,&#x27;warning&#x27;,&#x27;Conditioning is incomplete&#x27;,&#x27;Removal requires acknowledgment for the listed specimens. Nothing has moved yet.&#x27;);return;}
    const request=`SIM-${String(++serial).padStart(4,&#x27;0&#x27;)}`;
    s.busy=true;s.gate=null;say(s,&#x27;neutral&#x27;,&#x27;Awaiting simulated server confirmation&#x27;,`${request} · ${direction} · ${ids.length} specimens`);
    const product=designs.find(product=&gt;product.dataset.design===s.id);render(product);
    setTimeout(()=&gt;{
      if(states.get(s.id)!==s)return;
      ids.forEach(id=&gt;{s.serverEntries[id]={state:direction,hours:direction===&#x27;IN&#x27;?0:s.entries[id].hours};});
      s.busy=false;s.revision++;
      if(options.scenario===&#x27;Response lost&#x27;){s.pending={request,direction,ids,acknowledged};say(s,&#x27;warning&#x27;,&#x27;Confirmation unknown&#x27;,`${request} was submitted. Its response was lost; keep this request pending until checked.`);}
      else finish(s,{request,direction,ids,acknowledged});
      render(product);
    },360);
  }
  function finish(s,receipt){

      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
