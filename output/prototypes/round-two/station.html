<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEMO · Fabric USB scanner station</title><style>:root{color-scheme:light dark}html,body{margin:0;background:light-dark(#f5f7f9,#151e28)}#fabric-scanner-round-two>.viz-controls{display:none}#fabric-scanner-round-two .viz-carousel .r2-device{border-radius:0;border:0}#fabric-scanner-round-two{max-width:800px;margin:0 auto}.viz-carousel>section[hidden]{display:none}.cursor-interaction{cursor:pointer}</style></head><body><div id="fabric-scanner-round-two">
  <div class="viz-controls" aria-label="Scanner demo controls">
    <label class="form-label">Demo label<select class="form-select" data-demo="label"><option value="A">Stack A · 10 specimens</option><option value="B">Stack B · 20 specimens</option><option value="C">Stack C · 6 specimens</option></select></label>
    <button class="btn btn-primary" type="button" data-demo="scan">Simulate USB scan</button>
    <label class="form-label">Situation<select class="form-select" data-demo="scenario"><option value="normal">Normal</option><option value="partial">3 of 10 already outside</option><option value="early">Early checkout</option><option value="offline">Database unavailable</option><option value="lost">Response lost</option><option value="stale">Selection changed elsewhere</option></select></label>
    <button class="btn" type="button" data-demo="reset">Reset demo</button>
    <label class="form-check"><input class="form-check-input" type="checkbox" data-demo="sound"><span class="form-check-label">Chime</span></label>
  </div>
  <div class="viz-carousel viz-dotted-background" aria-label="Fixed room scanner layouts">
    <section data-variant="Bottom dock" aria-label="Bottom dock scanner"><div class="r2-device" data-layout="bottom" data-flow="immediate"></div></section>
    <section data-variant="Top controls" aria-label="Top controls scanner" hidden><div class="r2-device" data-layout="top" data-flow="immediate"></div></section>
    <section data-variant="Side controls" aria-label="Side controls scanner" hidden><div class="r2-device" data-layout="side" data-flow="immediate"></div></section>
    <section data-variant="History rail" aria-label="History rail scanner" hidden><div class="r2-device" data-layout="rail" data-flow="immediate"></div></section>
    <section data-variant="History first" aria-label="History first scanner" hidden><div class="r2-device" data-layout="history" data-flow="immediate"></div></section>
    <section data-variant="Receipt header" aria-label="Receipt header scanner" hidden><div class="r2-device" data-layout="receipt" data-flow="immediate"></div></section>
    <section data-variant="Review card" aria-label="Scan then act review card" hidden><div class="r2-device" data-layout="review-card" data-flow="review"></div></section>
    <section data-variant="Review bar" aria-label="Scan then act review bar" hidden><div class="r2-device" data-layout="review-bar" data-flow="review"></div></section>
  </div>
</div>
<style>
  #fabric-scanner-round-two .viz-controls { margin-bottom:14px; }
  #fabric-scanner-round-two [hidden] { display:none!important; }
  #fabric-scanner-round-two .r2-device {
    --r2-bg:light-dark(#f5f7f9,#151e28); --r2-panel:light-dark(#ffffff,#1d2a38);
    --r2-ink:light-dark(#172739,#edf3fb); --r2-muted:light-dark(#526578,#b5c4d4);
    --r2-line:light-dark(#d5dde7,#3a4c60); --r2-soft:light-dark(#e9eef5,#2a394c);
    --r2-primary:light-dark(#234d76,#a8cdf2); --r2-on-primary:light-dark(#ffffff,#14293f);
    --r2-ok:light-dark(#176449,#8de3bf); --r2-ok-bg:light-dark(#e8f5ed,#193d31);
    --r2-warn:light-dark(#83520a,#ffd38d); --r2-warn-bg:light-dark(#fff3dc,#493820);
    --r2-error:light-dark(#9c2631,#ffabb2); --r2-error-bg:light-dark(#fff0f1,#48272c);
    box-sizing:border-box; width:100%; max-width:800px; height:480px; margin:auto; position:relative; overflow:hidden;

  #fabric-scanner-round-two .r2-preview .preview-title { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  #fabric-scanner-round-two .stack-numbers { display:flex; gap:10px; flex-wrap:wrap; font-size:14px; }

  #fabric-scanner-round-two .r2-receipt[data-kind=warning],#fabric-scanner-round-two .r2-receipt[data-kind=pending] { background:var(--r2-warn-bg); color:var(--r2-warn); }

  #fabric-scanner-round-two .r2-receipt small { color:inherit; }

  #fabric-scanner-round-two [data-layout=history] .r2-focus { display:none; }
  #fabric-scanner-round-two [data-layout=history] .r2-history .history-row { padding:10px 4px; }

  #fabric-scanner-round-two [data-layout=receipt] .r2-direction .mode { min-height:44px; font-size:20px; min-width:100px; }
  #fabric-scanner-round-two [data-layout=receipt] .r2-content { display:block; }
  #fabric-scanner-round-two [data-layout=receipt] .r2-focus { display:none; }
  #fabric-scanner-round-two .receipt-strip { flex:none; padding:8px 16px; background:var(--r2-bg); }
  #fabric-scanner-round-two [data-layout=review-card] .r2-content { grid-template-columns:minmax(0,1fr) 230px; }
  #fabric-scanner-round-two [data-layout=review-bar] .r2-content { display:block; }
  #fabric-scanner-round-two [data-layout=review-bar] .r2-focus { padding:0 0 8px; }

  #fabric-scanner-round-two [data-layout=review-bar] .r2-direction { gap:12px; }
  #fabric-scanner-round-two .r2-overlay { position:absolute; inset:0; z-index:5; background:light-dark(#17273966,#05090dbb); display:flex; align-items:center; justify-content:center; padding:12px; }
  #fabric-scanner-round-two .r2-overlay[hidden] { display:none; }
  #fabric-scanner-round-two .r2-dialog { width:100%; max-width:620px; max-height:100%; display:flex; flex-direction:column; background:var(--r2-panel); border:1px solid var(--r2-line); border-radius:10px; overflow:hidden; box-shadow:0 10px 35px light-dark(#17273933,#00000055); }
  #fabric-scanner-round-two .dialog-head { flex:none; padding:14px 18px; border-bottom:1px solid var(--r2-line); display:grid; gap:4px; }
  #fabric-scanner-round-two .dialog-body { padding:12px 18px; overflow:auto; min-height:0; }
  #fabric-scanner-round-two .dialog-body .selection-tools { display:flex; gap:8px; margin-bottom:10px; align-items:center; }
  #fabric-scanner-round-two .dialog-body .selection-tools span { margin-left:auto; font-size:14px; }
  #fabric-scanner-round-two .specimen-checks { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
  #fabric-scanner-round-two .specimen-checks label { display:flex; align-items:center; gap:8px; padding:9px; min-height:52px; border:1px solid var(--r2-line); border-radius:6px; background:var(--r2-bg); }
  #fabric-scanner-round-two .specimen-checks label.checked { border-color:var(--r2-primary); background:var(--r2-soft); }
  #fabric-scanner-round-two .specimen-checks label.unavailable { opacity:.5; }
  #fabric-scanner-round-two input[type=checkbox] { width:20px; height:20px; accent-color:var(--r2-primary); flex:none; }
  #fabric-scanner-round-two .dialog-foot { flex:none; border-top:1px solid var(--r2-line); padding:12px 18px; display:flex; justify-content:space-between; gap:8px; align-items:center; }
  #fabric-scanner-round-two .dialog-foot button { min-height:48px; }
  #fabric-scanner-round-two .early-line { display:flex; justify-content:space-between; gap:12px; border-bottom:1px solid var(--r2-line); padding:9px 0; }
  #fabric-scanner-round-two .early-warning { color:var(--r2-warn); background:var(--r2-warn-bg); padding:12px; border-radius:6px; margin-bottom:10px; }
  @media(max-width:580px) {
    #fabric-scanner-round-two .r2-head { padding:8px 10px; }
    #fabric-scanner-round-two .r2-head .identity small { display:none; }
    #fabric-scanner-round-two .r2-head .identity strong { font-size:16px; }
    #fabric-scanner-round-two .connection { font-size:11px; }
    #fabric-scanner-round-two .r2-body { padding:10px; }
    #fabric-scanner-round-two .r2-content,#fabric-scanner-round-two [data-layout=review-card] .r2-content { grid-template-columns:1fr; }
    #fabric-scanner-round-two .r2-focus .ready-title { font-size:24px; }

    #fabric-scanner-round-two .r2-direction .hint { display:none; }
    #fabric-scanner-round-two .r2-scope { gap:5px; }
    #fabric-scanner-round-two .r2-scope button { padding:8px; font-size:12px; }
    #fabric-scanner-round-two .r2-scope .scope-label { display:none; }
    #fabric-scanner-round-two .r2-actions { padding:8px 10px; flex-wrap:wrap; }
    #fabric-scanner-round-two .r2-actions .mode { flex:1; min-width:0; min-height:46px; font-size:22px; }
    #fabric-scanner-round-two .r2-actions .action-hint { display:none; }
    #fabric-scanner-round-two .r2-input { padding:7px 10px; }

    #fabric-scanner-round-two .dialog-foot button { flex:1; padding:8px; font-size:14px; }

<script>
(() => {
  const root = document.getElementById('fabric-scanner-round-two');
  const devices = Array.from(root.querySelectorAll('.r2-device'));
  const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const now = Date.parse('2026-10-08T14:40:00Z');
  let scenario = 'normal', audio = null;
  const makeSpecimens = (count,inside,hours) => Array.from({length:count},(_,i) => ({number:i+1,inside,entered:inside ? now-hours*3600000 : null,exited:null}));
  const blankState = () => ({
    direction:'IN',scope:'stack',preview:null,selected:[],modal:null,pending:null,busy:false,last:'No new scans',
    receipt:{kind:'neutral',title:'Ready to scan',detail:'Whole stack · IN'},
    stacks:{A:{id:'A',project:'00073-LAB',material:'Cotton twill',test:'D5034',treatment:'AR',specimens:makeSpecimens(10,true,26)},B:{id:'B',project:'AB-004',material:'Nylon weave',test:'D2261',treatment:'3L',specimens:makeSpecimens(20,false,0)},C:{id:'C',project:'00702',material:'Polyester mesh',test:'D5034',treatment:'1L',specimens:makeSpecimens(6,true,4)}},
    history:[{direction:'IN',stack:'C',count:6,time:'06:40',detail:'Polyester mesh · 00702'},{direction:'IN',stack:'A',count:10,time:'Yesterday',detail:'Cotton twill · 00073-LAB'}].concat(Array.from({length:30},(_,i)=>({direction:i%2?'IN':'OUT',stack:'H'+String(Math.floor(i/2)+1).padStart(2,'0'),count:5+Math.floor(i/2)%12,time:'Oct 06',detail:'Earlier completed batch'}))),
    timer:null
  });
  const state = new Map(devices.map(el => [el,blankState()]));
  const directions = () => '<button type="button" class="mode cursor-interaction" data-action="direction" data-value="IN" aria-pressed="true">IN</button><button type="button" class="mode cursor-interaction" data-action="direction" data-value="OUT" aria-pressed="false">OUT</button>';
  const scope = () => '<div class="r2-scope"><span class="scope-label">Move</span><button type="button" class="cursor-interaction" data-action="scope" data-value="stack" aria-pressed="true">Whole stack</button><button type="button" class="cursor-interaction" data-action="scope" data-value="individual" aria-pressed="false">Individual</button></div>';
  devices.forEach(device => {
    const layout=device.dataset.layout, review=device.dataset.flow==='review';
    const header='<header class="r2-head"><div class="identity"><strong>Shared room</strong><small>Station 01 · DEMO</small></div><span class="connection">DB connected</span></header>';
    const top='<div class="r2-direction">'+directions()+'<span class="hint">'+(review?'Scan, then confirm':'Direction stays selected')+'</span></div>';
    const body='<main class="r2-body"><div class="r2-content"><section class="r2-focus"><div class="ready-title"></div><div class="r2-receipt" data-slot="receipt" aria-live="polite"></div><div class="r2-preview" data-slot="preview"></div></section><section class="r2-history"><h3>Recent scans</h3><div data-slot="history"></div></section></div></main>';
    const input='<div class="r2-input"><input type="text" inputmode="none" aria-label="Scan label" placeholder="Scan label · Enter" autocomplete="off" spellcheck="false"><button type="button" class="cursor-interaction" data-action="scan-input">Read label</button><span class="last" data-slot="last" aria-live="polite"></span></div>';
    let markup=header;
    if(layout==='top'||layout==='review-bar') markup+=top+body+'<footer class="r2-actions">'+scope()+(review?'<button type="button" class="primary cursor-interaction" data-action="commit">Scan a label first</button>':'<span class="action-hint">USB scanner ready</span>')+'</footer>';
    else if(layout==='side') markup+='<div class="side-shell">'+top+body+'</div><footer class="r2-actions">'+scope()+'</footer>';
    else if(layout==='receipt') markup+=top+'<div class="receipt-strip"><div class="r2-receipt" data-slot="strip-receipt" aria-live="polite"></div></div>'+body+'<footer class="r2-actions">'+scope()+'</footer>';
    else if(layout==='history') markup+='<div class="receipt-strip"><div class="r2-receipt" data-slot="strip-receipt" aria-live="polite"></div></div>'+body+'<footer class="r2-actions">'+directions()+scope()+'</footer>';
    else markup+=body+'<footer class="r2-actions">'+directions()+scope()+(review?'<button type="button" class="primary cursor-interaction" data-action="commit">Scan first</button>':'')+'</footer>';
    markup+=input+'<div class="r2-overlay" hidden></div>';
    device.innerHTML=markup;
    device.addEventListener('click', event => handle(device,event));
    device.addEventListener('change', event => {
      if(!event.target.matches('[data-specimen]')) return;
      const s=state.get(device), n=Number(event.target.dataset.specimen);
      s.selected=event.target.checked ? Array.from(new Set(s.selected.concat(n))) : s.selected.filter(x=>x!==n);
      event.target.closest('label').classList.toggle('checked',event.target.checked);
      updateSelection(device);
    });
    device.querySelector('.r2-input input').addEventListener('keydown', event => {
      if(event.key==='Enter') {event.preventDefault(); scan(device,event.target.value); event.target.value='';}
    });
    render(device);
    const tweaks={receiptSeconds:3};
    device.r2Tweaks=tweaks;
    if(globalThis.Tweak) {
      const tweak=new Tweak({container:device,onChange:()=>{}});
      tweak.addSlider(tweaks,'receiptSeconds',{label:'Receipt duration',min:2,max:8,step:1,unit:'s'});
    }
  });
  function active() {return devices.find(d=>!d.closest('[data-variant]').hidden);}
  function eligible(s,key) {return s.stacks[key].specimens.filter(p=>s.direction==='IN'?!p.inside:p.inside);}
  function parse(code) {
    const c=String(code).trim();
    if(/^(?:DEMO:)?[ABC]$/i.test(c)) return {key:c.slice(-1).toUpperCase(),number:null};
    const stack=c.match(/^UL1:S:00000000-0000-4000-8000-00000000000([123])$/i);
    if(stack) return {key:'ABC'[Number(stack[1])-1],number:null};
    const specimen=c.match(/^UL1:P:00000000-0000-4000-8000-([abc])00000000(\d{3})$/i);
    if(specimen) return {key:specimen[1].toUpperCase(),number:Number(specimen[2])};
    return null;
  }
  function show(device,kind,title,detail) {const s=state.get(device);clearTimeout(s.timer);s.receipt={kind,title,detail};render(device);}
  function render(device) {
    const s=state.get(device),review=device.dataset.flow==='review';
    if(s.receipt.kind==='neutral'&&/^Ready/.test(s.receipt.title)){s.receipt.title='Ready for '+s.direction;s.receipt.detail=(s.scope==='stack'?'Whole stack':'Individual specimens')+' · '+s.direction;}
    device.querySelectorAll('[data-action=direction]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.value===s.direction));b.disabled=s.busy||!!s.pending;});
    device.querySelectorAll('[data-action=scope]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.value===s.scope));b.disabled=s.busy||!!s.pending;});
    const connection=device.querySelector('.connection');
    connection.textContent=scenario==='offline'?'DB NOT AVAILABLE':'DB connected';connection.classList.toggle('offline',scenario==='offline');
    const title=device.querySelector('.ready-title');
    title.textContent=s.preview?'Stack '+s.preview+' · '+s.direction:(review?'Scan to review':'Ready for '+s.direction);
    const receiptHtml='<strong>'+escape(s.receipt.title)+'</strong><small>'+escape(s.receipt.detail)+'</small>'+(s.pending?'<button type="button" class="cursor-interaction" data-action="reconcile">Check pending request</button>':'');
    device.querySelectorAll('[data-slot=receipt],[data-slot=strip-receipt]').forEach(el=>{el.hidden=el.dataset.slot==='receipt'&&s.receipt.kind==='neutral'&&/^Ready/.test(s.receipt.title);el.dataset.kind=s.receipt.kind;el.innerHTML=receiptHtml;});
    const preview=device.querySelector('[data-slot=preview]'), key=s.preview;
    if(key) {
      const stack=s.stacks[key],inside=stack.specimens.filter(p=>p.inside).length, count=s.scope==='individual'?s.selected.length:eligible(s,key).length;
      preview.innerHTML='<div class="preview-title"><h3>'+escape(stack.material)+'</h3><strong>'+stack.specimens.length+' specimens</strong></div><small>'+escape(stack.project)+' · '+escape(stack.test)+' · '+escape(stack.treatment)+'</small><div class="stack-numbers"><span>'+inside+' inside</span><span>'+(stack.specimens.length-inside)+' outside</span><span>'+count+' to move '+s.direction+'</span></div>'+(review?'<small>Awaiting your confirmation</small>':'');
    } else preview.innerHTML='<h3>Scan any label on the stack</h3><small>'+(review?'Identify the stack, then press Record.':'All specimens eligible for '+s.direction+' move together.')+'</small>';
    device.querySelector('[data-slot=history]').innerHTML=s.history.map(row=>'<div class="history-row"><span class="direction-tag">'+escape(row.direction)+'</span><div class="history-description"><strong>Stack '+escape(row.stack)+' · '+row.count+' specimens</strong><small>'+escape(row.detail)+'</small></div><small>'+escape(row.time)+'</small></div>').join('');
    const last=device.querySelector('[data-slot=last]');
    last.dataset.kind=s.receipt.kind;
    last.textContent=['pending','error'].includes(s.receipt.kind)?s.receipt.title:s.last;
    const input=device.querySelector('.r2-input input');input.disabled=s.busy||!!s.pending||scenario==='offline';
    device.querySelector('[data-action=scan-input]').disabled=input.disabled;
    const commit=device.querySelector('[data-action=commit]');
    if(commit) {
      const n=key?(s.scope==='individual'?s.selected.length:eligible(s,key).length):0;
      commit.textContent=key?'Record '+s.direction+' · '+n:'Scan first';
      commit.disabled=!key||s.busy||!!s.pending||scenario==='offline';
    }
    renderModal(device);
  }
  function renderModal(device) {
    const s=state.get(device),overlay=device.querySelector('.r2-overlay');overlay.hidden=!s.modal;
    if(!s.modal) {overlay.innerHTML='';return;}
    const stack=s.stacks[s.preview];
    if(s.modal==='selection') {
      const allowed=eligible(s,s.preview).map(p=>p.number);
      overlay.innerHTML='<section class="r2-dialog" role="dialog" aria-modal="true" aria-label="Choose numbered specimens"><header class="dialog-head"><h2>Choose specimens · Stack '+s.preview+'</h2><small>'+stack.specimens.length+' registered · '+allowed.length+' available to move '+s.direction+'</small></header><div class="dialog-body"><div class="selection-tools"><button type="button" class="cursor-interaction" data-action="select-all">Select available</button><button type="button" class="cursor-interaction" data-action="clear">Clear</button><span data-slot="selected-count"></span></div><div class="specimen-checks">'+stack.specimens.map(p=>{
        const disabled=!allowed.includes(p.number),checked=s.selected.includes(p.number);
        return '<label class="cursor-interaction '+(disabled?'unavailable':checked?'checked':'')+'"><input type="checkbox" aria-label="Specimen '+String(p.number).padStart(2,'0')+'" data-specimen="'+p.number+'" '+(checked?'checked ':'')+(disabled?'disabled ':'')+'><span>'+String(p.number).padStart(2,'0')+'</span></label>';
      }).join('')+'</div></div><footer class="dialog-foot"><button type="button" class="cursor-interaction" data-action="cancel-modal">Cancel</button><button type="button" class="primary cursor-interaction" data-action="apply-selection"></button></footer></section>';
      updateSelection(device);
    } else {
      const specimens=stack.specimens.filter(p=>s.selected.includes(p.number)),early=specimens.filter(p=>p.entered!==null&&(now-p.entered)<24*3600000);
      overlay.innerHTML='<section class="r2-dialog" role="dialog" aria-modal="true" aria-label="Early checkout"><header class="dialog-head"><h2>Early checkout</h2><small>Stack '+s.preview+' · '+early.length+' of '+specimens.length+' selected specimens below 24 hours</small></header><div class="dialog-body"><div class="early-warning">These specimens have not completed 24 hours of conditioning.</div>'+early.map(p=>'<div class="early-line"><span>Specimen '+String(p.number).padStart(2,'0')+'</span><strong>'+((now-p.entered)/3600000).toFixed(1)+' h</strong></div>').join('')+'</div><footer class="dialog-foot"><button type="button" class="cursor-interaction" data-action="cancel-modal">Keep inside</button><button type="button" class="primary cursor-interaction" data-action="override">Override &amp; check OUT '+specimens.length+'</button></footer></section>';
    }
  }
  function updateSelection(device) {
    const s=state.get(device),n=s.selected.length;
    const count=device.querySelector('[data-slot=selected-count]');if(count)count.textContent=n+' selected';
    const button=device.querySelector('[data-action=apply-selection]');
    if(button){button.textContent=device.dataset.flow==='review'?'Use '+n+' specimens':'Check '+s.direction+' '+n+' specimens';button.disabled=n===0;}
  }
  function scan(device,code) {
    const s=state.get(device);
    if(s.busy||s.pending||s.modal)return;
    if(scenario==='offline'){show(device,'error','NOT AVAILABLE','Database connection unavailable · no movement recorded');return;}
    const parsed=parse(code);
    if(!parsed||!s.stacks[parsed.key]||(parsed.number&&!s.stacks[parsed.key].specimens.some(p=>p.number===parsed.number))){show(device,'error','Label not recognized','Scan a registered stack or specimen label');return;}
    s.preview=parsed.key;s.selected=[];
    if(s.scope==='individual') {
      if(parsed.number&&eligible(s,parsed.key).some(p=>p.number===parsed.number))s.selected=[parsed.number];
      s.modal='selection';render(device);return;
    }
    if(device.dataset.flow==='review'){show(device,'neutral','Stack '+parsed.key+' identified','Choose direction, then Record');return;}
    request(device);
  }
  function request(device,override=false) {
    const s=state.get(device);if(s.busy||s.pending||!s.preview)return;
    if(scenario==='offline'){show(device,'error','NOT AVAILABLE','Nothing recorded');return;}
    if(s.scope==='stack')s.selected=eligible(s,s.preview).map(p=>p.number);
    if(!s.selected.length){show(device,'neutral','Already recorded '+s.direction,'No timestamps changed · no new transaction');return;}
    const stack=s.stacks[s.preview],selected=stack.specimens.filter(p=>s.selected.includes(p.number));
    if(s.direction==='OUT'&&!override&&selected.some(p=>p.entered!==null&&now-p.entered<24*3600000)){s.modal='early';render(device);return;}
    s.modal=null;s.busy=true;
    const payload={id:'SIM-'+Date.now()+'-'+Math.random().toString(16).slice(2,8),direction:s.direction,key:s.preview,numbers:s.selected.slice(),override};
    show(device,'pending','Recording '+payload.direction+'…','Waiting for simulated database confirmation');
    setTimeout(()=>{
      if(state.get(device)!==s)return;
      s.busy=false;
      if(scenario==='offline'){show(device,'error','NOT AVAILABLE','Connection lost before commit · no movement recorded');return;}
      if(scenario==='stale'){show(device,'error','Selection changed elsewhere','Nothing recorded · rescan to refresh');return;}
      selected.forEach(p=>{p.inside=payload.direction==='IN';if(p.inside){p.entered=now;p.exited=null;}else p.exited=now;});
      s.history.unshift({direction:payload.direction,stack:payload.key,count:payload.numbers.length,time:'10:40:00',detail:'Specimens '+payload.numbers.map(n=>String(n).padStart(2,'0')).join(', ')+(override?' · early override':'')});
      payload.committed=true;
      if(scenario==='lost'){s.pending=payload;show(device,'pending','Confirmation pending','Request '+payload.id+' · check the same request');return;}
      confirmed(device,payload);
    },260);
  }
  function confirmed(device,payload) {
    const s=state.get(device);s.pending=null;s.scope='stack';s.last='Last: '+payload.direction+' '+payload.numbers.length+' · 10:40:00';
    show(device,'success',payload.direction+' recorded · '+payload.numbers.length+' specimens','10:40:00 · confirmed by simulated database'+(payload.override?' · incomplete conditioning':''));
    chime();
    s.timer=setTimeout(()=>{s.receipt={kind:'neutral',title:'Ready for '+s.direction,detail:s.last};s.preview=null;s.selected=[];render(device);},(device.r2Tweaks?.receiptSeconds||3)*1000);
    device.querySelector('.r2-input input').focus({preventScroll:true});
  }
  function chime() {
    if(!root.querySelector('[data-demo=sound]').checked)return;
    try {
      audio ||= new (window.AudioContext||window.webkitAudioContext)();
      audio.resume();
      [659,988].forEach((frequency,i)=>{const o=audio.createOscillator(),g=audio.createGain(),start=audio.currentTime+i*.11;o.frequency.value=frequency;o.type='sine';g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(.08,start+.02);g.gain.exponentialRampToValueAtTime(.0001,start+.24);o.connect(g);g.connect(audio.destination);o.start(start);o.stop(start+.25);});
    } catch {}
  }
  function handle(device,event) {
    const b=event.target.closest('[data-action]');if(!b||b.disabled)return;
    const s=state.get(device),action=b.dataset.action;
    if(action==='direction'){s.direction=b.dataset.value;s.selected=[];render(device);}
    if(action==='scope'){
      s.scope=b.dataset.value;
      if(s.scope==='individual'&&s.preview){s.selected=[];s.modal='selection';}
      render(device);
    }
    if(action==='scan-input'){const input=device.querySelector('.r2-input input');scan(device,input.value);input.value='';}
    if(action==='commit')request(device);
    if(action==='cancel-modal'){s.modal=null;s.selected=[];render(device);}
    if(action==='select-all'){s.selected=eligible(s,s.preview).map(p=>p.number);renderModal(device);}
    if(action==='clear'){s.selected=[];renderModal(device);}
    if(action==='apply-selection'){
      s.modal=null;
      if(device.dataset.flow==='review')render(device);else request(device);
    }
    if(action==='override')request(device,true);
    if(action==='reconcile'&&s.pending&&scenario!=='offline')confirmed(device,s.pending);
    if(!s.modal&&!s.busy&&!s.pending)device.querySelector('.r2-input input').focus({preventScroll:true});
  }
  function resetAll() {
    devices.forEach(device=>{
      clearTimeout(state.get(device).timer);
      const s=blankState();
      if(scenario==='partial')s.stacks.A.specimens.slice(0,3).forEach(p=>{p.inside=false;p.exited=now-3600000;});
      if(scenario==='early')s.stacks.A.specimens.forEach(p=>p.entered=now-4*3600000);
      state.set(device,s);render(device);
    });
  }
  root.querySelector('[data-demo=scan]').addEventListener('click',()=>scan(active(),'DEMO:'+root.querySelector('[data-demo=label]').value));
  root.querySelector('[data-demo=scenario]').addEventListener('change',e=>{scenario=e.target.value;resetAll();});
  root.querySelector('[data-demo=reset]').addEventListener('click',resetAll);
  root.addEventListener('keydown',event=>{
    if(event.target.closest('input,select,textarea,button')||event.ctrlKey||event.metaKey||event.altKey)return;
    const d=active();if(!d||state.get(d).modal)return;
    const input=d.querySelector('.r2-input input');
    if(event.key.length===1){input.focus({preventScroll:true});input.value=event.key;event.preventDefault();}
  });
})();
</script>
<script>document.querySelector(".r2-input input").focus({preventScroll:true});</script></body></html>
