<div id="fabric-focused-log">
  <div class="viz-controls" aria-label="Log prototype controls">
    <label class="form-label">Situation<select class="form-select" data-demo="scenario"><option value="normal">Normal</option><option value="offline">Database unavailable</option><option value="stale">Changed elsewhere</option></select></label>
    <button type="button" class="btn" data-demo="reset">Reset demo</button>
    <span class="text-small">Example: T004 recorded 10 OUT; only specimens 01–03 actually left.</span>
  </div>
  <div class="focused-log" aria-label="Desktop transaction log">
    <header class="log-header"><div><span>FABRIC / MAIN LAB</span><h2>Conditioning records</h2></div><span class="connection">DB connected</span></header>
    <div class="log-toolbar"><div class="view-buttons"><button type="button" class="cursor-interaction" data-action="view" data-value="transactions" aria-pressed="true">Transactions</button><button type="button" class="cursor-interaction" data-action="view" data-value="specimens" aria-pressed="false">Specimen records</button></div><input type="search" aria-label="Search log" placeholder="ID, stack, project or transaction"><button type="button" class="cursor-interaction" data-action="missed">Record missed scan</button></div>
    <div class="log-notice" hidden aria-live="polite"></div>
    <main class="log-table-scroll"><table aria-label="Conditioning log"><thead></thead><tbody></tbody></table></main>
    <footer class="log-footer"><strong data-slot="result">Stack A: 0 inside · 10 finished</strong><small data-slot="totals"></small><small>One ENTRY / EXIT per specimen · DEMO</small></footer>
    <div class="log-overlay" hidden></div>
  </div>
</div>
<style>
  #fabric-focused-log [hidden] { display:none!important; }
  #fabric-focused-log .viz-controls { margin-bottom:14px; }
  #fabric-focused-log .focused-log {
    --l-bg:light-dark(#f4f7fa,#172430); --l-panel:light-dark(#ffffff,#223344); --l-ink:light-dark(#1a2e43,#edf5fc);
    --l-muted:light-dark(#556e84,#b9cddd); --l-line:light-dark(#d1dde8,#405b72); --l-soft:light-dark(#eaf1f7,#2c435a);
    --l-primary:light-dark(#255981,#afd6f2); --l-on-primary:light-dark(#ffffff,#163249);
    --l-green:light-dark(#196446,#9bdfbe); --l-green-bg:light-dark(#e9f7ef,#1e4032);
    --l-error:light-dark(#a52b3a,#ffb3bd); --l-error-bg:light-dark(#ffeff1,#482931);
    box-sizing:border-box; width:100%; height:650px; background:var(--l-bg); color:var(--l-ink); overflow:hidden;
    border:1px solid var(--l-line); border-radius:8px; display:flex; flex-direction:column; position:relative;
    font:14px/1.4 system-ui,-apple-system,sans-serif; text-align:left; color-scheme:light dark;
  }
  #fabric-focused-log .focused-log * { box-sizing:border-box; }
  #fabric-focused-log .focused-log button,#fabric-focused-log .focused-log input,#fabric-focused-log .focused-log select,#fabric-focused-log .focused-log textarea { font:inherit; color:inherit; }
  #fabric-focused-log .focused-log button { min-height:38px; padding:8px 12px; background:var(--l-panel); border:1px solid var(--l-line); border-radius:5px; touch-action:manipulation; }
  #fabric-focused-log .focused-log button.primary,#fabric-focused-log .focused-log button[aria-pressed=true] { background:var(--l-primary); color:var(--l-on-primary); border-color:var(--l-primary); }
  #fabric-focused-log .focused-log button:disabled { opacity:.5; }
  #fabric-focused-log .focused-log input,#fabric-focused-log .focused-log select,#fabric-focused-log .focused-log textarea { padding:8px; border:1px solid var(--l-line); border-radius:5px; background:var(--l-panel); max-width:100%; min-width:0; }
  #fabric-focused-log .focused-log h2,#fabric-focused-log .focused-log h3,#fabric-focused-log .focused-log p { margin:0; font-weight:500; }
  #fabric-focused-log .focused-log strong { font-weight:500; }
  #fabric-focused-log .focused-log small { font-size:12px; color:var(--l-muted); }
  #fabric-focused-log .log-header { flex:none; min-height:65px; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--l-line); background:var(--l-panel); }
  #fabric-focused-log .log-header>div { display:flex; align-items:center; gap:24px; }
  #fabric-focused-log .log-header>div>span { font-size:12px; letter-spacing:.1em; color:var(--l-muted); }
  #fabric-focused-log .log-header h2 { font-size:20px; }
  #fabric-focused-log .connection { color:var(--l-green); font-size:12px; white-space:nowrap; }
  #fabric-focused-log .connection.offline { color:var(--l-error); }
  #fabric-focused-log .log-toolbar { flex:none; padding:10px 18px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; border-bottom:1px solid var(--l-line); background:var(--l-panel); }
  #fabric-focused-log .view-buttons { display:flex; gap:6px; }
  #fabric-focused-log .log-toolbar input { margin-left:auto; width:235px; }
  #fabric-focused-log .log-toolbar button { font-size:13px; }
  #fabric-focused-log .log-notice { flex:none; padding:10px 18px; background:var(--l-soft); font-size:13px; }
  #fabric-focused-log .log-notice[data-tone=success] { color:var(--l-green); background:var(--l-green-bg); }
  #fabric-focused-log .log-notice[data-tone=error] { color:var(--l-error); background:var(--l-error-bg); }
  #fabric-focused-log .log-table-scroll { flex:1; min-height:0; overflow:auto; padding:0 18px 20px; }
  #fabric-focused-log table { width:100%; border-collapse:collapse; font-size:13px; }
  #fabric-focused-log th { text-align:left; font-size:12px; font-weight:500; color:var(--l-muted); padding:12px 9px; border-bottom:1px solid var(--l-line); white-space:nowrap; }
  #fabric-focused-log thead { position:sticky; top:0; background:var(--l-bg); z-index:1; }
  #fabric-focused-log td { padding:11px 9px; border-bottom:1px solid var(--l-line); vertical-align:middle; }
  #fabric-focused-log td small { display:block; font-size:11px; margin-top:3px; }
  #fabric-focused-log td.id { font:12px/1.4 ui-monospace,SFMono-Regular,monospace; white-space:nowrap; }
  #fabric-focused-log tr.selected>td { background:var(--l-soft); }
  #fabric-focused-log tr.cancelled>td { color:var(--l-muted); }
  #fabric-focused-log .log-footer { flex:none; min-height:61px; padding:11px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; border-top:1px solid var(--l-line); background:var(--l-panel); font-size:13px; }
  #fabric-focused-log .log-overlay { position:absolute; inset:0; z-index:5; background:light-dark(#192c4255,#04090dbb); padding:18px; display:flex; justify-content:center; align-items:center; }
  #fabric-focused-log .log-dialog { width:100%; max-width:660px; max-height:100%; display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--l-line); border-radius:9px; background:var(--l-panel); box-shadow:0 10px 35px light-dark(#182a3c33,#00000066); }
  #fabric-focused-log .dialog-header { flex:none; padding:15px 20px; border-bottom:1px solid var(--l-line); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  #fabric-focused-log .dialog-header h2 { font-size:21px; }
  #fabric-focused-log .dialog-body { flex:1; min-height:0; overflow:auto; padding:15px 20px; }
  #fabric-focused-log .dialog-footer { flex:none; padding:12px 20px; display:flex; justify-content:space-between; gap:8px; border-top:1px solid var(--l-line); }
  #fabric-focused-log .dialog-footer>div { display:flex; gap:8px; }
  #fabric-focused-log .original { display:grid; gap:3px; padding-bottom:12px; margin-bottom:12px; border-bottom:1px solid var(--l-line); }
  #fabric-focused-log .fields { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  #fabric-focused-log .fields label { display:grid; gap:5px; font-size:12px; color:var(--l-muted); min-width:0; }
  #fabric-focused-log .fields .full { grid-column:1/-1; }
  #fabric-focused-log .fields input,#fabric-focused-log .fields textarea,#fabric-focused-log .fields select { width:100%; color:var(--l-ink); font-size:14px; }
  #fabric-focused-log .fields textarea { resize:vertical; min-height:52px; }
  #fabric-focused-log .selection-heading { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:14px 0 9px; }
  #fabric-focused-log .selection-heading button { font-size:12px; }
  #fabric-focused-log .specimen-checks { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; }
  #fabric-focused-log .specimen-checks label { display:flex; align-items:center; gap:8px; padding:8px; min-height:45px; border:1px solid var(--l-line); border-radius:5px; background:var(--l-bg); }
  #fabric-focused-log .specimen-checks input { flex:none; width:17px; height:17px; accent-color:var(--l-primary); padding:0; }
  #fabric-focused-log .specimen-checks .identifier { display:block; font:11px/1.4 ui-monospace,SFMono-Regular,monospace; color:var(--l-muted); overflow-wrap:anywhere; }
  #fabric-focused-log .impact { margin-top:12px; padding:10px 12px; background:var(--l-soft); border-radius:5px; font-size:13px; }
  #fabric-focused-log .validation { color:var(--l-error); background:var(--l-error-bg); padding:9px; margin-bottom:10px; border-radius:5px; }
  #fabric-focused-log .record-fields { display:grid; gap:9px; margin-bottom:18px; }
  #fabric-focused-log .record-fields>div { display:flex; justify-content:space-between; gap:12px; }
  #fabric-focused-log .record-history { border-top:1px solid var(--l-line); padding-top:12px; }
  #fabric-focused-log .record-history .event { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--l-line); }
  @media(max-width:600px) {
    #fabric-focused-log .log-header { padding:11px; }
    #fabric-focused-log .log-header>div>span { display:none; }
    #fabric-focused-log .log-header h2 { font-size:18px; }
    #fabric-focused-log .log-toolbar { padding:9px; gap:7px; }
    #fabric-focused-log .log-toolbar input { width:100%; flex:1; }
    #fabric-focused-log .log-table-scroll { padding:0 9px; }
    #fabric-focused-log .log-footer { padding:10px; gap:5px; }
    #fabric-focused-log .log-overlay { padding:8px; }
    #fabric-focused-log .dialog-header,#fabric-focused-log .dialog-body,#fabric-focused-log .dialog-footer { padding:11px; }
    #fabric-focused-log .dialog-footer { flex-wrap:wrap; }
    #fabric-focused-log .dialog-footer>div { margin-left:auto; }
    #fabric-focused-log .specimen-checks { grid-template-columns:repeat(2,minmax(0,1fr)); }
    #fabric-focused-log .fields { grid-template-columns:1fr; }
  }
</style>
<script>
/* DEMO_API */
</script>
<script>
(() => {
  const root=document.getElementById('fabric-focused-log'),app=root.querySelector('.focused-log'),esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let api=FabricPrototypeAPI.create({mistake:true}),scenario='normal',lastSavedState=null,state={view:'transactions',filter:'',selected:'T004',draft:null,modal:null,notice:null,busy:false,validation:null};
  const clone=value=>JSON.parse(JSON.stringify(value)),idRecord=id=>api.fixtures.find(r=>r.ID===Number(id));
  function remember(){
    if(!window.openai?.setWidgetState)return;
    const saved={modelContent:{prototype:'Transaction table with popup',view:state.view,selected_transaction:state.selected,edited_specimen_ids:state.draft?.specimen_ids||[]},privateContent:{type:'focused-log-v3',model:api.snapshot(),view:state.view,filter:state.filter,selected:state.selected,modal:state.modal,draft:state.draft,recordId:state.recordId}};
    lastSavedState=JSON.stringify(saved);window.openai.setWidgetState(saved).catch(()=>{});
  }
  function restore(saved){const s=saved?.privateContent;if(s?.type!=='focused-log-v3'||JSON.stringify(saved)===lastSavedState)return;api.restore(s.model);Object.assign(state,{view:s.view||'transactions',filter:s.filter||'',selected:s.selected||'T004',modal:s.modal||null,draft:s.draft||null,recordId:s.recordId,busy:false,validation:null});app.querySelector('[type=search]').value=state.filter;render();}
  function render(){
    app.querySelectorAll('[data-action=view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===state.view)));
    const connection=app.querySelector('.connection');connection.textContent=scenario==='offline'?'DB NOT AVAILABLE':'DB connected';connection.classList.toggle('offline',scenario==='offline');
    const notice=app.querySelector('.log-notice');notice.hidden=!state.notice;if(state.notice){notice.dataset.tone=state.notice.tone;notice.textContent=state.notice.text;}
    const records=api.listRecords(),a=records.filter(r=>r.prep.stack==='A');
    app.querySelector('[data-slot=result]').textContent='Stack A: '+a.filter(r=>r.ENTRY&&!r.EXIT).length+' inside · '+a.filter(r=>r.EXIT).length+' finished';
    app.querySelector('[data-slot=totals]').textContent=records.length+' specimen IDs · '+api.listTransactions().length+' log entries';
    renderTable();renderModal();
  }
  function renderTable(){
    const filter=state.filter.toLowerCase(),table=app.querySelector('table');
    if(state.view==='specimens'){
      table.querySelector('thead').innerHTML='<tr><th>Specimen ID</th><th>Stack / number</th><th>Project</th><th>ENTRY</th><th>EXIT</th><th>Status</th><th></th></tr>';
      table.querySelector('tbody').innerHTML=api.listRecords().filter(r=>(r.ID+' '+r.prep.stack+' '+r.prep.project).toLowerCase().includes(filter)).map(r=>'<tr><td class="id">'+r.ID+'</td><td>'+r.prep.stack+' / '+String(r.prep.number).padStart(2,'0')+'</td><td>'+esc(r.prep.project)+'</td><td>'+api.dateText(r.ENTRY)+'</td><td>'+api.dateText(r.EXIT)+'</td><td>'+r.status+'</td><td><button type="button" class="cursor-interaction" data-action="record" data-id="'+r.ID+'">Open</button></td></tr>').join('');
      return;
    }
    table.querySelector('thead').innerHTML='<tr><th>Transaction</th><th>Recorded · ET</th><th>Action</th><th>Stack / project</th><th>Specimens</th><th>Movement time</th><th></th></tr>';
    const movements=api.listMovements(),transactions=api.listTransactions().slice().reverse();
    table.querySelector('tbody').innerHTML=transactions.filter(e=>{
      const original=e.target_transaction?movements.find(m=>m.transaction_id===e.target_transaction):e,record=idRecord((e.specimen_ids||original?.specimen_ids||[])[0]);
      return (e.transaction_id+' '+e.type+' '+(e.direction||'')+' '+(e.target_transaction||'')+' '+(record?record.prep.stack+' '+record.prep.project:'')+' '+(e.specimen_ids||original?.specimen_ids||[]).join(' ')).toLowerCase().includes(filter);
    }).map(e=>{
      const movement=movements.find(m=>m.transaction_id===e.transaction_id),original=e.target_transaction?movements.find(m=>m.transaction_id===e.target_transaction):e,ids=movement?.specimen_ids||e.specimen_ids||original?.specimen_ids||[],record=idRecord(ids[0]),editable=!!movement&&!movement.cancelled;
      const action=e.type==='movement'?e.direction:e.type==='modification'?'Modified '+e.target_transaction:e.type==='undo'?'Undid '+e.target_transaction:'Printed';
      return '<tr class="'+(state.selected===e.transaction_id?'selected ':'')+(movement?.cancelled?'cancelled':'')+'"><td><strong>'+e.transaction_id+'</strong><small>'+(movement?.cancelled?'Undone':movement?.modified?'Modified':'')+'</small></td><td>'+api.clockText(e.recorded_at)+'<small>'+api.dateText(e.recorded_at).split(',')[0]+'</small></td><td>'+esc(action)+'</td><td>'+(record?'Stack '+record.prep.stack+'<small>'+esc(record.prep.project)+'</small>':'')+'</td><td>'+ids.length+'</td><td>'+api.dateText(movement?.observed_at||e.observed_at)+'</td><td><button type="button" class="cursor-interaction" data-action="'+(editable?'edit':'event')+'" data-id="'+e.transaction_id+'">'+(editable?'Edit':'View')+'</button></td></tr>';
    }).join('')||'<tr><td colspan="7">No matching transactions</td></tr>';
  }
  function editorBody(){
    const d=state.draft,original=api.listTransactions().find(e=>e.transaction_id===d.transaction_id),record=idRecord(d.specimen_ids[0])||api.fixtures.find(r=>r.prep.stack===d.stack),members=api.fixtures.filter(r=>r.prep.stack===record.prep.stack);
    let body='<div class="original"><strong>Stack '+record.prep.stack+' · '+esc(record.prep.material)+'</strong><small>'+esc(record.prep.project)+' · '+esc(record.prep.test)+' / '+esc(record.prep.treatment)+'</small><small>'+(original?'Original '+original.direction+' scan: '+original.specimen_ids.length+' specimens · '+api.dateText(original.observed_at):'Manual record · claimed time is separate from recording time')+'</small></div><div class="fields">';
    if(!original)body+='<label>Stack<select data-field="stack">'+FabricPrototypeAPI.config.map(g=>'<option '+(d.stack===g.stack?'selected':'')+'>'+g.stack+'</option>').join('')+'</select></label><label>Movement<select data-field="direction"><option '+(d.direction==='IN'?'selected':'')+'>IN</option><option '+(d.direction==='OUT'?'selected':'')+'>OUT</option></select></label>';
    body+='<label>Movement time · ET<input type="datetime-local" data-field="time" value="'+esc(d.time)+'"></label><label>Room<select data-field="room">'+['Shared','PPE','Footwear'].map(room=>'<option '+(d.room===room?'selected':'')+'>'+room+'</option>').join('')+'</select></label><label class="full">Notes · optional<textarea data-field="note" rows="2">'+esc(d.note)+'</textarea></label></div><div class="selection-heading"><strong>Specimens in this '+d.direction+' transaction</strong><button type="button" class="cursor-interaction" data-action="all">Select all '+members.length+'</button></div><div class="specimen-checks">'+members.map(r=>'<label class="cursor-interaction"><input type="checkbox" data-specimen="'+r.ID+'" aria-label="Specimen '+String(r.prep.number).padStart(2,'0')+'" '+(d.specimen_ids.includes(r.ID)?'checked':'')+'><span>#'+String(r.prep.number).padStart(2,'0')+'<span class="identifier">'+r.ID+'</span></span></label>').join('')+'</div><div class="impact" data-slot="impact"></div>';
    return body;
  }
  function renderModal(){
    const overlay=app.querySelector('.log-overlay');overlay.hidden=!state.modal;if(!state.modal){overlay.innerHTML='';return;}
    let title='',subtitle='',body='',left='',right='';
    if(state.modal==='edit'||state.modal==='missed'){
      title=state.modal==='missed'?'Record missed scan':'Edit '+state.draft.transaction_id;subtitle=state.draft.direction+' · one conditioning period';
      body=editorBody();left=state.modal==='edit'?'<button type="button" class="cursor-interaction" data-action="cancel">Cancel movement</button>':'';
      right='<button type="button" class="cursor-interaction" data-action="close">Close</button><button type="button" class="primary cursor-interaction" data-action="save" '+(state.busy||scenario==='offline'?'disabled':'')+'>Save changes</button>';
    }else if(state.modal==='cancel'){
      const row=api.listMovements().find(e=>e.transaction_id===state.selected),verdict=api.canUndo(state.selected);
      title='Cancel '+row.transaction_id+'?';subtitle=row.direction+' · '+row.specimen_ids.length+' specimens';
      body='<p>Undo this entire transaction. The original scan remains in the log with its cancellation.</p>'+(verdict.allowed?'':'<div class="validation">'+esc(verdict.reason)+'</div>');
      right='<button type="button" class="cursor-interaction" data-action="back">Keep movement</button><button type="button" class="primary cursor-interaction" data-action="confirm-cancel" '+(!verdict.allowed||state.busy||scenario==='offline'?'disabled':'')+'>Cancel transaction</button>';
    }else if(state.modal==='record'){
      const row=api.listRecords().find(r=>r.ID===state.recordId);
      title='Specimen '+String(row.prep.number).padStart(2,'0')+' · Stack '+row.prep.stack;subtitle='ID '+row.ID;
      body='<div class="record-fields"><div><span>ENTRY</span><strong>'+api.dateText(row.ENTRY)+'</strong></div><div><span>EXIT</span><strong>'+api.dateText(row.EXIT)+'</strong></div><div><span>Status</span><strong>'+row.status+'</strong></div><div><span>Project</span><strong>'+esc(row.prep.project)+'</strong></div></div><div class="record-history"><h3>Specimen log</h3>'+row.raw_json_time.map(e=>'<div class="event"><span>'+esc(e.type==='movement'?e.direction:e.type)+' · '+e.transaction_id+'</span><small>'+api.dateText(e.recorded_at)+'</small></div>').join('')+'</div>';
      right='<button type="button" class="cursor-interaction" data-action="close">Close</button>';
    }else{
      const e=api.listTransactions().find(x=>x.transaction_id===state.selected);
      title=e.transaction_id+' · '+e.type;subtitle=api.dateText(e.recorded_at);
      body=e.type==='modification'?'<p>Changed '+esc(Object.keys(e.changes).join(', '))+' on '+e.target_transaction+'.</p>'+(e.changes.specimen_ids?'<div class="impact">Now includes '+e.changes.specimen_ids.length+' specimen IDs.</div>':''):e.type==='undo'?'<p>Reversed transaction '+e.target_transaction+' for all '+e.specimen_ids.length+' affected specimens.</p>':'<p>Printed labels for '+e.specimen_ids.length+' individually identified specimens.</p>';
      right='<button type="button" class="cursor-interaction" data-action="close">Close</button>';
    }
    overlay.innerHTML='<section class="log-dialog" role="dialog" aria-modal="true" aria-label="'+title+'"><header class="dialog-header"><h2>'+title+'</h2><small>'+subtitle+'</small></header><div class="dialog-body">'+(state.validation?'<div class="validation" role="alert">'+esc(state.validation)+'</div>':'')+body+'</div><footer class="dialog-footer">'+left+'<div>'+right+'</div></footer></section>';
    if(state.draft&&['edit','missed'].includes(state.modal))updateImpact();
  }
  function updateImpact(){
    const el=app.querySelector('[data-slot=impact]');if(!el||!state.draft)return;
    const d=state.draft;
    try{
      const projected=state.modal==='missed'?null:api.previewModification(d.transaction_id,{specimen_ids:d.specimen_ids,observed_at:api.utcInput(d.time),room:d.room,note:d.note});
      if(!projected){el.textContent=d.specimen_ids.length+' selected · manual '+d.direction;return;}
      const record=idRecord(d.specimen_ids[0])||api.fixtures.find(r=>r.prep.stack===d.stack),rows=projected.filter(r=>r.prep.stack===record.prep.stack);
      el.textContent='Result: '+rows.filter(r=>r.ENTRY&&!r.EXIT).length+' inside · '+rows.filter(r=>r.EXIT).length+' finished · '+d.specimen_ids.length+' included';
    }catch(error){el.textContent=error.message;}
  }
  function openEdit(id){
    const row=api.listMovements().find(e=>e.transaction_id===id);if(!row||row.cancelled)return;
    state.selected=id;state.draft={...clone(row),time:api.localInput(row.observed_at),version:api.version(),stack:idRecord(row.specimen_ids[0]).prep.stack};state.modal='edit';state.notice=null;state.validation=null;render();remember();
  }
  function notice(tone,text){state.notice={tone,text};const el=app.querySelector('.log-notice');el.hidden=false;el.dataset.tone=tone;el.textContent=text;}
  function error(message){
    state.validation=message;notice('error',message);renderModal();
  }
  async function save(){
    if(state.busy||!state.draft)return;
    app.querySelectorAll('[data-field]').forEach(el=>state.draft[el.dataset.field]=el.value);
    const d=state.draft,currentApi=api,currentState=state;let time;try{time=api.utcInput(d.time);}catch(err){error(err.message);return;}
    state.validation=null;
    state.busy=true;notice('pending','Saving to database…');app.querySelector('[data-action=save]').disabled=true;
    try{
      const result=state.modal==='missed'?await api.recordMissed({direction:d.direction,room:d.room,observed_at:time,specimen_ids:d.specimen_ids,note:d.note}):await api.modify(d.transaction_id,{observed_at:time,room:d.room,specimen_ids:d.specimen_ids,note:d.note},d.version);
      if(api!==currentApi||state!==currentState)return;
      state.busy=false;state.modal=null;state.draft=null;notice('success','Saved · '+result.transaction_id+' added to the log.');render();remember();
    }catch(err){if(api!==currentApi||state!==currentState)return;state.busy=false;error(err.message);app.querySelector('[data-action=save]').disabled=scenario==='offline';}
  }
  app.addEventListener('click',async event=>{
    const b=event.target.closest('[data-action]');if(!b||b.disabled||state.busy)return;const action=b.dataset.action;
    if(action==='view'){state.view=b.dataset.value;render();}
    if(action==='edit')openEdit(b.dataset.id);
    if(action==='event'){state.selected=b.dataset.id;state.modal='event';renderModal();}
    if(action==='record'){state.recordId=Number(b.dataset.id);state.modal='record';renderModal();}
    if(action==='close'){state.modal=null;state.draft=null;render();}
    if(action==='all'){state.draft.specimen_ids=api.fixtures.filter(r=>r.prep.stack===state.draft.stack).map(r=>r.ID);renderModal();}
    if(action==='save')await save();
    if(action==='cancel'){state.modal='cancel';renderModal();}
    if(action==='back'){state.modal='edit';renderModal();}
    if(action==='confirm-cancel'){
      const currentApi=api,currentState=state;state.busy=true;notice('pending','Cancelling transaction…');
      try{const result=await currentApi.undo(state.selected);if(api!==currentApi||state!==currentState)return;state.busy=false;state.modal=null;state.draft=null;notice('success',state.selected+' cancelled · '+result.count+' specimens · '+result.transaction_id+'.');render();remember();}
      catch(err){if(api!==currentApi||state!==currentState)return;state.busy=false;error(err.message);}
    }
    if(action==='missed'){
      state.validation=null;state.draft={transaction_id:'NEW',stack:'B',direction:'IN',room:'Shared',time:'2026-10-08T10:30',specimen_ids:api.fixtures.filter(r=>r.prep.stack==='B').map(r=>r.ID),note:''};state.modal='missed';renderModal();
    }
    remember();
  });
  app.addEventListener('input',event=>{
    if(!state.draft||!event.target.matches('[data-field]'))return;
    state.draft[event.target.dataset.field]=event.target.value;updateImpact();
  });
  app.addEventListener('change',event=>{
    if(!state.draft)return;
    if(event.target.matches('[data-specimen]')){
      const id=Number(event.target.dataset.specimen);state.draft.specimen_ids=event.target.checked?Array.from(new Set(state.draft.specimen_ids.concat(id))).sort((a,b)=>a-b):state.draft.specimen_ids.filter(x=>x!==id);updateImpact();
    }
    if(event.target.matches('[data-field=stack]')){state.draft.stack=event.target.value;state.draft.specimen_ids=api.fixtures.filter(r=>r.prep.stack===state.draft.stack).map(r=>r.ID);renderModal();}
    if(event.target.matches('[data-field=direction]')){state.draft.direction=event.target.value;renderModal();}
  });
  app.querySelector('[type=search]').addEventListener('input',event=>{state.filter=event.target.value;renderTable();remember();});
  root.querySelector('[data-demo=scenario]').addEventListener('change',event=>{scenario=event.target.value;api.setScenario(scenario);render();});
  root.querySelector('[data-demo=reset]').addEventListener('click',()=>{api=FabricPrototypeAPI.create({mistake:true});api.setScenario(scenario);state={view:'transactions',filter:'',selected:'T004',draft:null,modal:null,notice:null,busy:false,validation:null};app.querySelector('[type=search]').value='';render();remember();});
  render();restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
})();
</script>
