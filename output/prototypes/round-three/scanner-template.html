<div id="fabric-focused-scanner">
  <div class="viz-controls" aria-label="Scanner prototype controls">
    <label class="form-label">Demo specimen<select class="form-select" data-demo="specimen"><option value="100000000101">A · specimen 01 · 10 in stack</option><option value="1099511627756">B · specimen 01 · 20 in stack</option><option value="1099511627775">B · specimen 20 · maximum ID</option><option value="271000000001">C · specimen 01 · early checkout</option></select></label>
    <button type="button" class="btn btn-primary" data-demo="scan">Simulate USB scan</button>
    <label class="form-label">Input encoding<select class="form-select" data-demo="encoding"><option value="binary">Binary text</option><option value="decimal">Decimal</option><option value="hex">Hexadecimal</option></select></label>
    <label class="form-label">Situation<select class="form-select" data-demo="scenario"><option value="normal">Normal</option><option value="offline">Database unavailable</option><option value="lost">Response lost</option><option value="stale">Stale review</option></select></label>
    <button type="button" class="btn" data-demo="reset">Reset demo</button>
    <label class="form-check"><input type="checkbox" class="form-check-input" data-demo="sound"><span class="form-check-label">Chime</span></label>
    <label class="form-label">Manual test<input class="form-control" data-demo="manual" aria-label="Manual specimen code" placeholder="Paste code, then Enter" autocomplete="off" spellcheck="false"></label>
  </div>
  <div class="viz-dotted-background">
    <div class="focused-station" aria-label="800 by 480 room scanner">
      <header class="station-head"><div><strong>Shared room</strong><small>Station 01 · DEMO</small></div><span class="connection">DB connected</span></header>
      <main class="station-middle">
        <section class="ready-area" data-tone="ready" aria-live="polite">
          <div class="ready-title">Ready for IN</div>
          <div class="ready-description">Scan a specimen to review its stack.</div>
          <div class="review-card" hidden></div>
          <button type="button" class="reconcile cursor-interaction" data-action="reconcile" hidden>Check pending transaction</button>
        </section>
        <section class="history-area"><header><h3>Recent transactions</h3><span>Time · ET</span></header><div class="history-scroll" data-slot="history"></div></section>
      </main>
      <footer class="station-dock">
        <div class="directions"><button type="button" class="direction cursor-interaction" data-action="direction" data-value="IN" aria-pressed="true">IN</button><button type="button" class="direction cursor-interaction" data-action="direction" data-value="OUT" aria-pressed="false">OUT</button></div>
        <div class="scope"><button type="button" class="cursor-interaction" data-action="scope" data-value="stack" aria-pressed="true">Whole stack</button><button type="button" class="cursor-interaction" data-action="scope" data-value="individual" aria-pressed="false">Individual</button></div>
        <button type="button" class="undo cursor-interaction" data-action="undo" disabled>Undo</button>
        <button type="button" class="primary submit cursor-interaction" data-action="submit" disabled>Scan first</button>
      </footer>
      <div class="scanner-input"><span class="capture-status" aria-live="polite">Scanner ready · binary + Enter</span><span class="last-result" aria-live="polite">No new transactions</span></div>
      <div class="station-overlay" hidden></div>
    </div>
  </div>
</div>

  #fabric-focused-scanner .station-dialog { max-width:610px; width:100%; max-height:100%; background:var(--s-panel); border:1px solid var(--s-line); border-radius:9px; display:flex; flex-direction:column; overflow:hidden; }

<script>
(() => {
  const root=document.getElementById('fabric-focused-scanner'),station=root.querySelector('.focused-station'),esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let api=FabricPrototypeAPI.create(),scenario='normal',encoding='binary',timer=null,audio=null,lastSavedState=null;
  let state={direction:'IN',scope:'stack',lookup:null,selected:[],pending:null,lastTransaction:null,busy:false,modal:null,tone:'ready',title:'Ready for IN',detail:'Scan a specimen to review its stack.',last:'No new transactions'};
  const design={confirmationSeconds:3,historyWidth:292};
  function selectedRows(){return !state.lookup?[]:state.scope==='stack'?api.eligible(state.lookup.members,state.direction):state.lookup.members.filter(r=>state.selected.includes(r.ID));}
  function remember(){
    if(!window.openai?.setWidgetState)return;
    const privateContent={type:'focused-scanner-v3',model:api.snapshot(),direction:state.direction,scope:state.scope,lookupId:state.lookup?.record.ID||null,selected:state.selected,pending:state.pending,lastTransaction:state.lastTransaction,last:state.last,encoding};
    const saved={modelContent:{prototype:'Bottom dock with review',direction:state.direction,scope:state.scope,selected_specimen_ids:state.selected,last_transaction:state.lastTransaction,conditioning_periods_per_specimen:1},privateContent};
    lastSavedState=JSON.stringify(saved);window.openai.setWidgetState(saved).catch(()=>{});
  }
  async function restore(saved){
    const s=saved?.privateContent;if(s?.type!=='focused-scanner-v3'||JSON.stringify(saved)===lastSavedState)return;
    api.restore(s.model);encoding=s.encoding||'binary';root.querySelector('[data-demo=encoding]').value=encoding;
    Object.assign(state,{direction:s.direction||'IN',scope:s.scope||'stack',selected:s.selected||[],pending:s.pending||null,lastTransaction:s.lastTransaction||null,last:s.last||'No new transactions'});
    if(s.lookupId)try{state.lookup=await api.lookup(s.lookupId);state.tone='review';state.title='Review '+state.direction;}catch{}
    if(state.pending){state.tone='pending';state.title='Confirmation pending';state.detail='Check the same submitted transaction.';}
    render();
  }
  function status(tone,title,detail){clearTimeout(timer);state.tone=tone;state.title=title;state.detail=detail;render();}
  function render(){
    const locked=state.busy||!!state.pending,ready=station.querySelector('.ready-area');
    ready.dataset.tone=state.tone;
    station.querySelector('.ready-title').textContent=state.tone==='ready'?'Ready for '+state.direction:state.title;
    station.querySelector('.ready-description').textContent=state.detail;
    const connection=station.querySelector('.connection');connection.textContent=scenario==='offline'?'DB NOT AVAILABLE':'DB connected';connection.classList.toggle('offline',scenario==='offline');
    station.querySelectorAll('[data-action=direction]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.value===state.direction));b.disabled=locked;});
    station.querySelectorAll('[data-action=scope]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.value===state.scope));b.disabled=locked;});
    const preview=station.querySelector('.review-card');preview.hidden=!state.lookup||['confirmed','pending','error'].includes(state.tone);
    if(state.lookup){
      const {record,members}=state.lookup,conditioning=members.filter(r=>r.ENTRY&&!r.EXIT).length,finished=members.filter(r=>r.EXIT).length,selected=selectedRows();
      preview.innerHTML='<div class="stack-title"><strong>Stack '+record.prep.stack+'</strong><strong>'+selected.length+' to move '+state.direction+'</strong></div><small>'+esc(record.prep.project)+' · '+esc(record.prep.material)+' · '+esc(record.prep.test)+' / '+esc(record.prep.treatment)+'</small><div class="identifier">Scanned #'+String(record.prep.number).padStart(2,'0')+' · ID '+record.ID+'</div><div class="counts"><span>'+conditioning+' inside</span><span>'+finished+' finished</span><span>'+(members.length-conditioning-finished)+' awaiting</span></div><div class="selected">Specimens: '+(selected.length?selected.map(r=>String(r.prep.number).padStart(2,'0')).join(', '):'none eligible')+'</div>';
    }
    const submit=station.querySelector('[data-action=submit]'),n=selectedRows().length;
    submit.textContent=state.lookup?'Submit '+state.direction+' · '+n:'Scan first';submit.disabled=!state.lookup||locked||scenario==='offline';
    station.querySelector('[data-action=undo]').disabled=!state.lastTransaction||locked||scenario==='offline'||!api.canUndo(state.lastTransaction).allowed;
    station.querySelector('[data-action=reconcile]').hidden=!state.pending;
    station.querySelector('[data-action=reconcile]').disabled=scenario==='offline'||state.busy;
    updateCaptureStatus();
    const last=station.querySelector('.last-result');last.dataset.tone=state.tone;last.textContent=state.tone==='pending'?state.title:state.last;
    const lookupRecord=id=>api.fixtures.find(r=>r.ID===id);
    const real=api.listTransactions().slice().reverse().map(e=>{
      const original=e.target_transaction?api.listMovements().find(m=>m.transaction_id===e.target_transaction):e,first=lookupRecord((e.specimen_ids||original?.specimen_ids||[])[0]),count=(e.specimen_ids||original?.specimen_ids||[]).length;
      return '<div class="history-row"><strong>'+esc(e.type==='movement'?e.direction:e.type==='undo'?'UNDO':'Printed')+' · '+count+' specimens</strong><time>'+api.clockText(e.recorded_at)+'</time><small>'+e.transaction_id+' · '+(first?'Stack '+first.prep.stack:'')+'</small></div>';
    }).join('');
    const history=station.querySelector('[data-slot=history]'),scrollTop=history.scrollTop;
    history.innerHTML=real+Array.from({length:24},(_,i)=>'<div class="history-row"><strong>'+(i%2?'IN':'OUT')+' · '+(5+Math.floor(i/2)%8)+' specimens</strong><time>Oct 06</time><small>Earlier completed stack H'+String(Math.floor(i/2)+1).padStart(2,'0')+'</small></div>').join('');
    history.scrollTop=scrollTop;
    renderModal();
  }
  function renderModal(){
    const overlay=station.querySelector('.station-overlay');overlay.hidden=!state.modal;if(!state.modal){overlay.innerHTML='';return;}
    const rows=state.lookup?.members||[];
    let title='',subtitle='',body='',action='',label='';
    if(state.modal==='selection'){
      title='Choose specimens';subtitle='Stack '+state.lookup.record.prep.stack+' · move '+state.direction;
      const available=api.eligible(rows,state.direction).map(r=>r.ID);
      body='<div class="selection-tools"><div class="buttons"><button type="button" class="cursor-interaction" data-action="select-all">Select available</button><button type="button" class="cursor-interaction" data-action="clear">Clear</button></div><span data-slot="selection-count">'+state.selected.length+' selected</span></div><div class="number-grid">'+rows.map(r=>'<label class="cursor-interaction '+(!available.includes(r.ID)?'disabled':'')+'"><input type="checkbox" data-id="'+r.ID+'" aria-label="Specimen '+String(r.prep.number).padStart(2,'0')+'" '+(state.selected.includes(r.ID)?'checked ':'')+(!available.includes(r.ID)?'disabled ':'')+'><span>'+String(r.prep.number).padStart(2,'0')+'</span></label>').join('')+'</div>';
      action='use-selection';label='Use '+state.selected.length+' specimens';
    } else if(state.modal==='early'){
      const selected=selectedRows(),early=selected.filter(r=>api.now()-Date.parse(r.ENTRY)<24*3600000);
      title='Early checkout';subtitle=early.length+' specimens have less than 24 hours';
      body='<div class="early-warning">Override to record their actual removal with incomplete conditioning.</div>'+early.map(r=>'<div class="early-row"><span>Specimen '+String(r.prep.number).padStart(2,'0')+'</span><strong>'+((api.now()-Date.parse(r.ENTRY))/3600000).toFixed(1)+' h</strong></div>').join('');
      action='override';label='Override & check OUT '+selected.length;
    } else {
      const verdict=api.canUndo(state.lastTransaction);
      title='Undo transaction '+state.lastTransaction+'?';subtitle=verdict.direction+' · '+verdict.count+' specimens';
      body='<p>Reverse this entire transaction for all '+verdict.count+' affected specimens.</p>';
      action='confirm-undo';label='Undo transaction';
    }
    overlay.innerHTML='<section class="station-dialog" role="dialog" aria-modal="true" aria-label="'+title+'"><header class="dialog-head"><h2>'+title+'</h2><small>'+subtitle+'</small></header><div class="dialog-body">'+body+'</div><footer class="dialog-foot"><button type="button" class="cursor-interaction" data-action="close">Cancel</button><button type="button" class="primary cursor-interaction" data-action="'+action+'" '+(state.modal==='selection'&&!state.selected.length?'disabled':'')+'>'+label+'</button></footer></section>';
  }
  async function read(code){
    if(state.busy||state.pending||state.modal)return;
    if(scenario==='offline'){status('error','NOT AVAILABLE','No database connection · nothing submitted.');return;}
    let id;try{id=api.decodeId(code,encoding);}catch(error){status('error','ID not recognized',error.message);return;}
    const currentApi=api,currentState=state;
    state.busy=true;status('pending','Looking up specimen…','Retrieving its stack and ENTRY/EXIT fields.');
    try{
      const result=await currentApi.lookup(id);if(api!==currentApi||state!==currentState)return;
      state.lookup=result;state.selected=[];state.busy=false;
      if(state.scope==='individual'){
        if(api.eligible([state.lookup.record],state.direction).length)state.selected=[id];
        state.modal='selection';
      }
      status('review','Review '+state.direction,'Check the stack, then press Submit.');
      remember();
    }catch(error){if(api!==currentApi||state!==currentState)return;state.busy=false;state.lookup=null;status('error','Lookup unavailable',error.message);}
  }
  async function submit(acknowledge=false){
    if(state.busy||state.pending||!state.lookup)return;
    const selected=selectedRows();
    if(state.direction==='OUT'&&!acknowledge&&selected.some(r=>api.now()-Date.parse(r.ENTRY)<24*3600000)){state.modal='early';renderModal();return;}
    const currentApi=api,currentState=state;
    state.modal=null;state.busy=true;
    const request={request_id:crypto.randomUUID(),scanned_id:state.lookup.record.ID,direction:state.direction,scope:state.scope,specimen_ids:selected.map(r=>r.ID),room:'Shared',version:state.lookup.version,acknowledge_early:acknowledge};
    status('pending','Recording '+state.direction+'…','Waiting for database confirmation.');
    try{const result=await currentApi.move(request);if(api!==currentApi||state!==currentState)return;state.busy=false;confirmed(result);}
    catch(error){
      if(api!==currentApi||state!==currentState)return;
      state.busy=false;
      if(error.pending){state.pending=request.request_id;status('pending','Confirmation pending','Check this submitted transaction before scanning again.');remember();}
      else status('error','Nothing recorded',error.message);
    }
  }
  function confirmed(result){
    state.pending=null;state.modal=null;state.busy=false;
    if(result.noop){status('review','Already recorded',result.detail);return;}
    state.lastTransaction=result.transaction_id;state.scope='stack';state.lookup=null;state.selected=[];
    state.last=result.direction+' '+result.count+' · '+api.clockText(result.recorded_at)+' · '+result.transaction_id;
    status('confirmed',result.direction+' recorded · '+result.count+' specimens',api.clockText(result.recorded_at)+' · '+result.transaction_id+(result.early_override?' · early checkout':''));
    playChime();remember();clearAfter();
  }
  function clearAfter(){
    timer=setTimeout(()=>{state.lookup=null;state.selected=[];status('ready','Ready for '+state.direction,'Scan a specimen to review its stack.');},design.confirmationSeconds*1000);
  }
  async function undo(){
    const currentApi=api,currentState=state;
    state.modal=null;state.busy=true;status('pending','Undoing transaction…','Waiting for database confirmation.');
    try {
      const result=await currentApi.undo(state.lastTransaction);if(api!==currentApi||state!==currentState)return;state.busy=false;state.lastTransaction=null;state.last='UNDO '+result.count+' · '+api.clockText(result.recorded_at);
      status('confirmed','Transaction undone · '+result.count+' specimens',result.target_transaction+' reversed · '+api.clockText(result.recorded_at));remember();clearAfter();
    }catch(error){if(api!==currentApi||state!==currentState)return;state.busy=false;status('error','Undo unavailable',error.message);}
  }
  function playChime(){
    if(!root.querySelector('[data-demo=sound]').checked)return;
    try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();[659,988].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.1;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.23);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.24);});}catch{}
  }
  station.addEventListener('click',async event=>{
    const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;
    if(action==='direction'){state.direction=b.dataset.value;state.selected=[];status(state.lookup?'review':'ready','Ready for '+state.direction,state.lookup?'Check the stack, then press Submit.':'Scan a specimen to review its stack.');}
    if(action==='scope'){state.scope=b.dataset.value;state.selected=[];if(state.scope==='individual'&&state.lookup)state.modal='selection';render();}
    if(action==='submit')await submit();
    if(action==='close'){state.modal=null;render();}
    if(action==='select-all'){state.selected=api.eligible(state.lookup.members,state.direction).map(r=>r.ID);renderModal();}
    if(action==='clear'){state.selected=[];renderModal();}
    if(action==='use-selection'){state.modal=null;render();}
    if(action==='override')await submit(true);
    if(action==='undo'){state.modal='undo';renderModal();}
    if(action==='confirm-undo')await undo();
    if(action==='reconcile'){
      const currentApi=api,currentState=state;
      state.busy=true;render();
      try{const result=await currentApi.status(state.pending);if(api!==currentApi||state!==currentState)return;confirmed(result);}catch(error){if(api!==currentApi||state!==currentState)return;state.busy=false;status('pending','Confirmation pending',error.message);}
    }
    remember();
  });
  station.addEventListener('change',event=>{
    if(!event.target.matches('[data-id]'))return;
    const id=Number(event.target.dataset.id);state.selected=event.target.checked?Array.from(new Set(state.selected.concat(id))):state.selected.filter(x=>x!==id);
    const count=station.querySelector('[data-slot=selection-count]');count.textContent=state.selected.length+' selected';
    const use=station.querySelector('[data-action=use-selection]');use.textContent='Use '+state.selected.length+' specimens';use.disabled=!state.selected.length;
    remember();
  });
  function updateCaptureStatus(){
    const el=station.querySelector('.capture-status');
    const paused=document.hidden||!document.hasFocus();
    el.dataset.paused=String(paused);
    el.textContent=paused?'Tap screen to resume scanning':state.modal?'Finish the popup before scanning':state.busy||state.pending?'Scanner paused · waiting for confirmation':scenario==='offline'?'Scanner unavailable':'Scanner ready · '+encoding+' + Enter';
  }
  const capture=FabricScannerCapture.attach({
    format:()=>encoding,
    maxLength:40,gapMs:250,
    ignore:element=>!!element.closest('[data-demo=manual],textarea,[contenteditable=true]'),
    enabled:()=>!state.busy&&!state.pending&&!state.modal&&scenario!=='offline',
    onScan:code=>read(code),
    onReject:message=>{station.querySelector('.capture-status').textContent=message;},
    onBlocked:()=>{station.querySelector('.capture-status').textContent='Scan not accepted · finish the current action, then rescan.';},
    onFocusChange:updateCaptureStatus
  });
  window.fabricScannerCaptureReady=true;
  root.querySelector('[data-demo=manual]').addEventListener('keydown',async event=>{if(event.key==='Enter'){event.preventDefault();const code=event.target.value;event.target.value='';await read(code);}});
  root.querySelector('[data-demo=scan]').addEventListener('click',()=>{
    const id=BigInt(root.querySelector('[data-demo=specimen]').value),code=encoding==='binary'?id.toString(2):encoding==='hex'?id.toString(16):id.toString();
    read(code);
  });
  root.querySelector('[data-demo=encoding]').addEventListener('change',event=>{capture.reset();encoding=event.target.value;updateCaptureStatus();remember();});
  root.querySelector('[data-demo=scenario]').addEventListener('change',event=>{scenario=event.target.value;api.setScenario(scenario);if(scenario==='offline')status('error','NOT AVAILABLE','No database connection · nothing submitted.');else if(state.pending)status('pending','Confirmation pending','Check the same submitted transaction.');else status(state.lookup?'review':'ready','Ready for '+state.direction,state.lookup?'Check the stack, then press Submit.':'Scan a specimen to review its stack.');});
  root.querySelector('[data-demo=reset]').addEventListener('click',()=>{
    capture.reset();clearTimeout(timer);api=FabricPrototypeAPI.create();api.setScenario(scenario);
    state={direction:'IN',scope:'stack',lookup:null,selected:[],pending:null,lastTransaction:null,busy:false,modal:null,tone:'ready',title:'Ready for IN',detail:'Scan a specimen to review its stack.',last:'No new transactions'};if(scenario==='offline')status('error','NOT AVAILABLE','No database connection · nothing submitted.');else render();remember();
  });
  render();restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
  if(globalThis.Tweak){const tweak=new Tweak({container:station,onChange:()=>{station.querySelector('.station-middle').style.gridTemplateColumns=station.clientWidth>580?'minmax(0,1fr) '+design.historyWidth+'px':'';}});tweak.addSlider(design,'confirmationSeconds',{label:'Green confirmation duration',min:2,max:6,unit:'s'});tweak.addSlider(design,'historyWidth',{label:'Recent log width',min:245,max:325,step:10,unit:'px'});}
})();
</script>
